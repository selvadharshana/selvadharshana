name: Unified Profile & Telemetry Sync

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # Runs every 6 hours
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/unified-profile-sync.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [profile_sync, webhook]

permissions:
  contents: write

jobs:
  sync-visualizers:
    name: Generate All Multi-Platform Visualizers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Generate Complete Profile Visualizer Suite via Official Marketplace Action
      - name: 🏙️ Generate Profile Visualizer Suite
        uses: Tharun4743/github-profile-visualizer@v1
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          visualizers: '3d-city,activity,habits,languages,achievements,velocity,radar,summary,stats'
          theme: 'ocean-light'
          radar-skills: 'Cognitive Systems:0.90,Programming:0.88,Data Structures:0.85,Git & GitHub:0.92,Problem Solving:0.87'
          output-dir: 'assets'
          filename: 'profile-3d-ocean-light.svg'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # 2. Generate Multi-Platform GitHub Telemetry & Snake Animations
      - name: 📊 Generate Multi-Platform Telemetry & Snake
        run: node scripts/generate-telemetry.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      # 3. Single Atomic Commit & Push
      - name: 🚀 Commit & Push All Visualizers
        run: |
          git config user.name "selvadharshana"
          git config user.email "dharshu994389@gmail.com"
          git stash -- assets/ || true
          git pull origin main --rebase || true
          git stash pop || true
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): sync profile visualizers [skip ci]"
            git push origin main
          else
            echo "No visualizer changes detected."
          fi
